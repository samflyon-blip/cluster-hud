name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", "index.html", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ClusTer-HUD.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ClusTer-HUD.apk \
            --title "ClusTer HUD (build ${{ github.run_number }})" \
            --notes "Install on your phone: download ClusTer-HUD.apk and open it." \
            --target "${{ github.sha }}" --latest
